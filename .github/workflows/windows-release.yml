name: Windows desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (X.Y.Z)
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pyinstaller==6.22.2 pytest==9.1.1

      - name: Resolve build version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version }}"
          }
          "EWASTE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run focused tests
        shell: pwsh
        run: |
          python -m pytest tests/test_desktop_ui.py tests/test_desktop_api.py tests/test_history.py tests/test_desktop_runtime.py tests/test_release_metadata.py tests/test_windows_packaging.py -q

      - name: Build Windows ZIP
        shell: pwsh
        run: ./scripts/build_windows_app.ps1 -Version $env:EWASTE_VERSION

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:EWASTE_PACKAGED_APP = Join-Path $PWD "build/windows/$env:EWASTE_VERSION/pyinstaller-dist/E-Waste Triage"
          python -m pytest tests/test_packaged_smoke.py::test_frozen_app_exercises_desktop_and_phone_paths -q

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: E-Waste-Triage-${{ env.EWASTE_VERSION }}-windows-x64
          path: dist/E-Waste-Triage-${{ env.EWASTE_VERSION }}-windows-x64.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/E-Waste-Triage-${{ env.EWASTE_VERSION }}-windows-x64.zip
          generate_release_notes: true
