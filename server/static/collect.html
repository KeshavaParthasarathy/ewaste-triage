<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Waste Training Photo Collection</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font:16px system-ui,-apple-system,sans-serif;margin:0;padding:16px;background:#101310;color:#f1f4ef}
  main{max-width:560px;margin:auto}
  h1{font-size:24px;margin:4px 0 6px}
  p{line-height:1.4}
  .card{background:#1a201a;border:1px solid #354035;border-radius:12px;padding:16px;margin:14px 0}
  label{display:block;margin:14px 0 6px;font-weight:600}
  select,input,button{width:100%;font:inherit;border-radius:8px;padding:12px}
  select,input{background:#101410;border:1px solid #526052;color:#fff}
  button{margin-top:16px;border:0;background:#79d879;color:#071007;font-weight:700}
  button:disabled{opacity:.5}
  .muted{color:#aeb7aa;font-size:14px}
  .ok{border-color:#5dae5d;background:#172a17}
  .error{border-color:#c06655;background:#2a1815}
  [hidden]{display:none!important}
  #preview{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:8px;margin-top:12px}
  .count{font-size:36px;font-weight:750}
</style>

<main>
  <h1>Training Photo Collection</h1>
  <p class="muted">Choose the device class and give this physical device one stable ID. Keep both selections unchanged while taking 12–20 varied photos.</p>

  <form id="collectionForm" class="card">
    <label for="className">Device class</label>
    <select id="className" name="class_name" required>
      <option value="">Loading approved classes…</option>
    </select>

    <label for="deviceId">Physical device ID</label>
    <input id="deviceId" name="device_id" required inputmode="text" autocapitalize="none"
           pattern="[A-Za-z0-9][A-Za-z0-9.-]*" placeholder="e.g. phone01">
    <p class="muted">Use a new ID for each physical item. Do not put underscores in the ID.</p>

    <label for="photo">Take or choose a photo</label>
    <input id="photo" name="image" type="file" accept="image/*" capture="environment" required>
    <img id="preview" alt="Photo preview" hidden>

    <button id="save" type="submit">Save training photo</button>
  </form>

  <section id="result" aria-live="polite"></section>
</main>

<script>
const MAX_SIDE = 1600;
const form = document.getElementById('collectionForm');
const fileInput = document.getElementById('photo');
const preview = document.getElementById('preview');
const result = document.getElementById('result');
const save = document.getElementById('save');

async function loadClasses() {
  const response = await fetch('/collection-classes');
  if (!response.ok) throw new Error(`Could not load classes (${response.status})`);
  const body = await response.json();
  document.getElementById('className').innerHTML = '<option value="">Choose a class…</option>' +
    body.classes.map(item => `<option value="${item.value}">${item.label}</option>`).join('');
}

function jpegBlob(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      preview.src = canvas.toDataURL('image/jpeg', 0.9);
      preview.hidden = false;
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('JPEG conversion failed')),
                    'image/jpeg', 0.9);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error('This photo could not be read'));
    img.src = URL.createObjectURL(file);
  });
}

fileInput.addEventListener('change', async () => {
  if (!fileInput.files[0]) return;
  try { await jpegBlob(fileInput.files[0]); }
  catch (err) { result.innerHTML = `<div class="card error">${err.message}</div>`; }
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!form.reportValidity()) return;
  save.disabled = true;
  save.textContent = 'Saving…';
  result.innerHTML = '';
  try {
    const blob = await jpegBlob(fileInput.files[0]);
    const data = new FormData();
    data.append('class_name', document.getElementById('className').value);
    data.append('device_id', document.getElementById('deviceId').value.trim());
    data.append('image', blob, 'photo.jpg');
    const response = await fetch('/ingest', {method: 'POST', body: data});
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `Upload failed (${response.status})`);
    result.innerHTML = `<div class="card ok"><div class="count">${body.device_photo_count}</div>
      <strong>photos saved for this device</strong><p class="muted">${body.saved}</p></div>`;
    fileInput.value = '';
    save.textContent = 'Take next photo';
  } catch (err) {
    result.innerHTML = `<div class="card error">${err.message}</div>`;
    save.textContent = 'Try again';
  } finally {
    save.disabled = false;
  }
});

loadClasses().catch(err => {
  result.innerHTML = `<div class="card error">${err.message}</div>`;
});
</script>
