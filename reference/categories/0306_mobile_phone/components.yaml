associations:
  - association_id: phone_bold_removable_battery_construction
    template_id: phone_bold_removable_battery
    component_id: battery_construction
    position: 0
    status: legacy_specific
    applicability: >-
      Applies only to the BlackBerry Bold 9900: RIM's dated release describes a
      removable and rechargeable battery. This construction fact does not establish
      the chemistry or condition of the battery currently installed.
    notes:
      - The shared 9900/9930 battery statement supports the exact 9900 construction but does not substitute 9930 network facts or authorize disassembly.
    evidence_level: A
    source_ids:
      - phone_rim_bold_9900_launch_2011
  - association_id: phone_bold_removable_battery_physical_keyboard
    template_id: phone_bold_removable_battery
    component_id: physical_keyboard
    position: 1
    status: legacy_specific
    applicability: >-
      Applies only to the BlackBerry Bold 9900, whose dated RIM release identifies
      its physical BlackBerry keyboard as part of the reviewed model architecture.
    notes:
      - Keyboard presence does not establish current condition or repairability.
    evidence_level: A
    source_ids:
      - phone_rim_bold_9900_launch_2011
  - association_id: phone_fairphone_modular_removable_battery_construction
    template_id: phone_fairphone_modular_removable
    component_id: battery_construction
    position: 0
    status: exact_model_confirmed
    applicability: >-
      Applies only to Fairphone 5: the dated launch describes a modular architecture
      with a replaceable battery. Replaceable construction does not identify the
      current installed chemistry or current battery condition.
    notes:
      - The modular and replaceable design statement is construction evidence, not a retained-capacity endpoint or confirmation of current installed chemistry.
    evidence_level: A
    source_ids:
      - phone_fairphone_5_launch_2023
  - association_id: phone_galaxy_s5_removable_battery_construction
    template_id: phone_galaxy_s5_removable
    component_id: battery_construction
    position: 0
    status: legacy_specific
    applicability: >-
      Applies only to Samsung Galaxy S5: Samsung's dated exact-model teardown calls
      the battery changeable and shows it behind a reattachable back cover.
    notes:
      - Changeable construction does not establish current battery presence, condition, chemistry, or user authorization to perform service.
    evidence_level: A
    source_ids:
      - phone_samsung_galaxy_s5_teardown_2014
  - association_id: phone_iphone_se3_integrated_battery_construction
    template_id: phone_iphone_se3_integrated
    component_id: battery_construction
    position: 0
    status: exact_model_confirmed
    applicability: >-
      Applies only to iPhone SE (3rd generation): Apple's exact-generation repair
      procedure documents adhesive strips and a technician service sequence. The
      battery is service-replaceable but not represented here as user-removable.
    notes:
      - The technician procedure does not authorize user disassembly or establish current installed chemistry.
    evidence_level: A
    source_ids:
      - phone_apple_iphone_se_3_battery_2024
  - association_id: phone_legacy_removable_battery_construction
    template_id: phone_legacy_removable_battery
    component_id: battery_construction
    position: 0
    status: legacy_specific
    applicability: >-
      Applies only to the original GSM/GPRS Motorola RAZR V3 described by service
      manual 6809485A72-O, which documents removing the battery cover and battery.
    notes:
      - The service procedure does not cover later V3 revisions, prove the present battery, or authorize unqualified user disassembly.
    evidence_level: A
    source_ids:
      - phone_motorola_v3_service_manual_2004
  - association_id: phone_legacy_removable_original_battery_chemistry
    template_id: phone_legacy_removable_battery
    component_id: original_battery_chemistry
    position: 1
    status: legacy_specific
    applicability: >-
      Applies only to the original GSM/GPRS Motorola RAZR V3 architecture: the
      dated service manual identifies the original specified battery as Li-ion.
    notes:
      - Original architecture does not establish the chemistry of a present replacement battery; current installed battery chemistry remains Unknown.
    evidence_level: A
    source_ids:
      - phone_motorola_v3_service_manual_2004
