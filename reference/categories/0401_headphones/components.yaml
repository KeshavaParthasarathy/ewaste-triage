associations:
  - association_id: headphones_modern_wireless_device_battery
    template_id: headphones_modern_wireless
    component_id: device_battery
    position: 0
    status: commonly_associated
    applicability: >-
      Applies to the reviewed rechargeable wireless over-ear subtype as the battery
      installed in the headphone itself; it is not a charging-case battery and does
      not project chemistry, capacity, condition, or serviceability.
    notes:
      - The reviewed Sony, Bose, and Beats releases each establish battery-dependent operation for the supported subtype exemplars.
    evidence_level: B
    source_ids:
      - headphones_beats_studio_pro_launch_2023
      - headphones_bose_quietcomfort_ultra_launch_2023
      - headphones_sony_wh_1000xm5_launch_2022
  - association_id: headphones_modern_wireless_device_battery_chemistry_unknown
    template_id: headphones_modern_wireless
    component_id: device_battery_chemistry
    position: 1
    status: unknown
    applicability: >-
      Rechargeable wireless operation does not establish the hidden installed
      battery chemistry across this over-ear subtype.
    notes:
      - Obtain exact-model manufacturer battery documentation or a compliant, legible installed-battery marking before assigning chemistry.
    evidence_level: null
    source_ids: []
