industry_averages:
  - record_id: laptop_industry_service_life
    scope:
      kind: category
      id: 0303_laptop
    subject: device
    endpoint: service_life
    endpoint_kind: total_life
    metric: elapsed_time
    unit: years
    lower_bound: 3.0
    upper_bound: 7.0
    endpoint_qualification: >-
      Historical completed first-service duration for surveyed laptops, read as an
      approximately 3-7 years weighted interquartile range from the one-year-bin
      histogram in Figure 1 and its publisher-linked S1 support. This graph-read
      reference describes reported possession until first transfer or disposal;
      it is not physical failure life, a current-item forecast, or an exact model estimate.
    applicable_from: null
    applicable_to: null
    model_year_from: null
    model_year_to: null
    required_variant_ids: []
    excluded_variant_ids: []
    precedence: 0
    evidence_level: C
    assumptions:
      - The weighted graph quartile positions can be read only approximately from one-year bins.
      - The first-service endpoint ends at sale, gifting, return, recycling, or disposal as reconstructed by the study.
      - This category reference is historical context and is not selected as an exact identity prediction.
    population_definition: >-
      306 laptop records reported by private households in Switzerland and
      Liechtenstein, with sale years 1987-2006 documented in Supporting Information
      Table S12; the analysis concerns reconstructed completed first-service durations.
    publication_period: >-
      Household survey conducted in 2014 with follow-up interviews in 2015-2016;
      article first published 2017-02-24 and later included in the February 2018 issue.
    methodology: >-
      Convenience recruitment with demographic weighting; Figure 1 presents
      weighted one-year service-lifetime bins and quartile markers, while
      publisher-linked S1 Table S12 supplies the laptop count and sale-year span
      and S-10 documents the one-year weighted histograms and quartile method.
    uncertainty: >-
      Broad estimate with Low confidence for an individual item because the bounds
      are graph-read from binned weighted data and reflect retrospective historical reporting.
    limitations:
      - Convenience recruitment and demographic weighting do not create a probability sample of all laptops.
      - Recall, selection, and calendar reconstruction uncertainty affect reported purchase and transfer timing.
      - Prior-owner reconstruction can include time in storage before transfer and does not isolate continuous active use.
      - Quartile markers from one-year bins are not exactly half of raw observations and are not precise unbinned quantiles.
      - The interval is reference-only; a future consumer must retain reason industry_average_reference_only rather than treating it as an item forecast.
    source_ids:
      - laptop_swiss_service_lifetime_2017
