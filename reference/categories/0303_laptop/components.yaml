associations:
  - association_id: laptop_legacy_serviceable_display_backlight_unknown
    template_id: laptop_legacy_serviceable
    component_id: display_backlight
    position: 0
    status: unknown
    applicability: >-
      The dated Apple Service Source documents establish LCD-panel and inverter
      connections for the reviewed PowerBook revisions but do not establish mercury
      or an exact fluorescent or CCFL lamp construction.
    notes:
      - Obtain an independently dated exact-revision construction record before assigning lamp type or substance content.
    evidence_level: null
    source_ids: []
  - association_id: laptop_legacy_serviceable_memory
    template_id: laptop_legacy_serviceable
    component_id: memory
    position: 1
    status: legacy_specific
    applicability: >-
      Applies to a removable expansion memory card if installed in the reviewed
      original, DVI, 1.33 GHz, or 1.5 GHz PowerBook G4 12-inch revision; onboard
      memory is distinct and this does not assert that an expansion card is present.
    notes:
      - Service documentation shows the conditional expansion-card procedure, not user authorization or all-memory removability.
    evidence_level: B
    source_ids:
      - laptop_apple_powerbook_g4_12_133_service_2005
      - laptop_apple_powerbook_g4_12_15_service_2007
      - laptop_apple_powerbook_g4_12_original_service_2005
  - association_id: laptop_legacy_serviceable_memory_serviceability
    template_id: laptop_legacy_serviceable
    component_id: memory_serviceability
    position: 2
    status: legacy_specific
    applicability: >-
      The reviewed Apple Service Source documents establish access to and replacement
      of the optional expansion memory card if installed across the source-covered
      PowerBook G4 12-inch revisions; onboard RAM remains distinct.
    notes:
      - Service documentation does not establish that an expansion card is installed or authorize a user to perform the procedure.
    evidence_level: B
    source_ids:
      - laptop_apple_powerbook_g4_12_133_service_2005
      - laptop_apple_powerbook_g4_12_15_service_2007
      - laptop_apple_powerbook_g4_12_original_service_2005
  - association_id: laptop_legacy_serviceable_storage
    template_id: laptop_legacy_serviceable
    component_id: storage
    position: 3
    status: legacy_specific
    applicability: >-
      The reviewed Apple Service Source documents provide hard-drive assembly
      removal and replacement procedures for the original, DVI, 1.33 GHz, and
      1.5 GHz PowerBook G4 12-inch revisions.
    notes:
      - This is construction and service information; it does not establish the current drive, its condition, or permission for disassembly.
    evidence_level: B
    source_ids:
      - laptop_apple_powerbook_g4_12_133_service_2005
      - laptop_apple_powerbook_g4_12_15_service_2007
      - laptop_apple_powerbook_g4_12_original_service_2005
  - association_id: laptop_legacy_serviceable_storage_serviceability
    template_id: laptop_legacy_serviceable
    component_id: storage_serviceability
    position: 4
    status: legacy_specific
    applicability: >-
      The reviewed Apple Service Source documents establish hard-drive assembly
      removal and replacement procedures across the source-covered PowerBook G4
      12-inch revisions.
    notes:
      - Service documentation does not establish the current drive or its condition and does not authorize disassembly.
    evidence_level: B
    source_ids:
      - laptop_apple_powerbook_g4_12_133_service_2005
      - laptop_apple_powerbook_g4_12_15_service_2007
      - laptop_apple_powerbook_g4_12_original_service_2005
  - association_id: laptop_modern_integrated_memory
    template_id: laptop_modern_integrated
    component_id: memory
    position: 0
    status: exact_model_confirmed
    applicability: >-
      Applies only to Apple MacBook Air (M2, 2022), whose exact-model parts article
      lists logic-board assemblies by unified-memory capacity.
    notes:
      - The integrated parts mapping does not establish material composition or authorize board-level repair.
    evidence_level: A
    source_ids:
      - laptop_apple_macbook_air_parts_2023
  - association_id: laptop_modern_integrated_memory_serviceability
    template_id: laptop_modern_integrated
