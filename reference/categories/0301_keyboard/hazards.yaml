hazards:
  - hazard_id: keyboard_damaged_lithium_ion_battery
    component_id: power_source
    scope:
      kind: subtype
      id: keyboard_wireless_rechargeable
    applicability: >-
      For a rechargeable keyboard, a user report of overheating, swelling, or
      battery damage activates precautionary guidance. Lithium-ion-specific guidance
      applies if the installed battery is lithium-ion; rechargeability and the
      reported issue do not establish chemistry. Item-specific manufacturer
      information or battery markings may help identify chemistry.
    trigger_observation_keys:
      - observations.issue_flags.overheating
      - observations.issue_flags.swelling_or_battery_damage
    severity: urgent
    immediate_actions:
      - As a precaution after the reported issue, stop using and charging the keyboard.
      - Keep the battery or device away from flammable materials without crushing or puncturing it.
    follow_up_actions:
      - Contact the manufacturer or a qualified specialist for handling instructions.
      - If the installed battery is lithium-ion, arrange prompt transfer to an appropriate battery or household-hazardous-waste collection point.
    handling_guidance:
      - If the installed battery is lithium-ion, do not place it in household trash or a municipal recycling bin.
      - If the installed battery is lithium-ion and can be safely removed without forcing the enclosure, prevent terminal contact; otherwise keep the device intact and follow manufacturer or receiving-program instructions.
    disposal_guidance:
      - If the installed battery is lithium-ion, use a certified electronics recycler, battery recycler, or household-hazardous-waste program that accepts lithium-ion batteries.
      - If the installed battery is lithium-ion and is damaged, follow the receiving program's instructions for damaged batteries before transport.
    evidence_level: B
    source_ids:
      - epa_used_li_ion_2026
  - hazard_id: keyboard_leaking_primary_cell
    component_id: power_source
    scope:
      kind: subtype
      id: keyboard_wireless_replaceable_battery
    applicability: >-
      For a replaceable-battery keyboard, a user report of swelling or battery
      damage activates precautionary guidance. Leakage-specific guidance applies if
      the installed cell is leaking; primary-cell guidance applies if it is
      non-rechargeable. The reported issue and subtype do not establish leakage,
      installed-cell type, or chemistry.
    trigger_observation_keys:
      - observations.issue_flags.swelling_or_battery_damage
    severity: caution
    immediate_actions:
      - Stop using the keyboard; if leakage is present, avoid direct contact with battery contents.
      - Keep the cell and device away from children and heat sources.
    follow_up_actions:
      - Follow local public-health guidance if battery contents contact skin or eyes.
      - If leakage is present, check local hazardous-waste instructions before transporting the cell.
    handling_guidance:
      - If the installed cell is non-rechargeable, do not attempt to recharge it.
      - If leakage is present, do not mix that cell with new cells or with a different battery type.
    disposal_guidance:
      - Follow local municipal hazardous-waste requirements for the battery; if leakage is present, confirm that the chosen collection program accepts leaking cells.
      - Protect exposed terminals as directed by the receiving program.
    evidence_level: B
    source_ids:
      - keyboard_health_canada_battery_safety_2024
