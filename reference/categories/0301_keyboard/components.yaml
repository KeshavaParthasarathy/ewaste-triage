  - association_id: keyboard_standard_power_source
    template_id: keyboard_standard
    component_id: power_source
    position: 8
    status: conditional
    applicability: >-
      Present for battery-bearing wireless subtypes and not asserted for a wired
      battery-free identity; exact installed cell, charging circuit, and chemistry
      remain identity-specific.
    notes:
      - MX Keys S is rechargeable; the scoped K780 family uses replaceable cells.
    evidence_level: C
    source_ids:
      - logitech_k780_technical_specifications_2025
      - logitech_mx_keys_s_specification_2023
      - razer_blackwidow_v4_support_2026
  - association_id: keyboard_standard_replaceable_cell_compartment
    template_id: keyboard_standard
    component_id: replaceable_cell_compartment
    position: 9
    status: conditional
    applicability: >-
      Applies only to the reviewed replaceable-battery subtype, where the scoped
      K780 family documents two replaceable AAA cells; it is not projected onto
      rechargeable or wired identities.
    notes:
      - Cell chemistry remains Unknown.
    evidence_level: C
    source_ids:
      - logitech_k780_technical_specifications_2025
  - association_id: keyboard_standard_switch_membrane_assembly
    template_id: keyboard_standard
    component_id: switch_membrane_assembly
    position: 10
    status: conditional
    applicability: >-
      Applies according to resolved identity evidence: Y-R0073 documents scissor
      keys and BlackWidow V4 documents Gen-3 mechanical switch options. No membrane
      mechanism is projected onto wired products whose sources do not state it.
    notes:
      - Switch architecture does not establish power architecture or hidden materials.
    evidence_level: C
    source_ids:
      - logitech_mx_keys_s_specification_2023
      - razer_blackwidow_v4_launch_2023
  - association_id: keyboard_standard_switch_material_unknown
