    evidence_level: null
    source_ids: []
  - association_id: keyboard_standard_keycaps
    template_id: keyboard_standard
    component_id: keycaps
    position: 4
    status: commonly_associated
    applicability: >-
      Applies as the user-facing key surfaces of reviewed keyboard products;
