associations:
  - association_id: keyboard_modern_wireless_power_source
    template_id: keyboard_modern_wireless
    component_id: power_source
    position: 0
    status: commonly_associated
    applicability: >-
      Applies to the reviewed rechargeable wireless subtype and represents an
      internal rechargeable power source, distinct from the replaceable AAA-cell
      architecture documented for the separate replaceable-battery subtype.
    notes:
      - The reviewed MX Keys S source establishes rechargeability but does not establish cell chemistry.
    evidence_level: B
    source_ids:
      - logitech_mx_keys_s_specification_2023
  - association_id: keyboard_modern_wireless_wireless_module
    template_id: keyboard_modern_wireless
    component_id: wireless_module
    position: 1
    status: commonly_associated
    applicability: >-
      Applies to the reviewed rechargeable wireless subtype; radio protocols and
      receiver details remain identity-specific.
    notes:
      - The reviewed Y-R0073 source identifies Bluetooth and Logi Bolt connectivity.
    evidence_level: B
    source_ids:
      - logitech_mx_keys_s_specification_2023
  - association_id: keyboard_modern_wireless_battery_chemistry_unknown
    template_id: keyboard_modern_wireless
    component_id: battery_chemistry
    position: 2
    status: unknown
    applicability: >-
      Rechargeability and wireless operation do not establish hidden battery
      chemistry across this subtype.
    notes:
      - Requires exact-model manufacturer documentation or a compliant, legible battery marking.
    evidence_level: null
    source_ids: []
  - association_id: keyboard_standard_buckling_spring_mechanism
    template_id: keyboard_standard
    component_id: buckling_spring_mechanism
    position: 0
    status: conditional
    applicability: >-
      Generic IBM material supports a buckling-spring mechanism for the Model M
      family as a conditional category fact. It does not establish exact part
      1391401, installed presence in the current item, power architecture, or a
      reviewed legacy subtype.
    notes:
      - No legacy overlay is authored while the required subtype power architecture remains Unknown.
    evidence_level: C
    source_ids:
      - ibm_model_m_buckling_spring_2026
  - association_id: keyboard_standard_buckling_spring_material_unknown
    template_id: keyboard_standard
    component_id: switch_material
    position: 1
    status: unknown
    applicability: >-
      The generic mechanism evidence does not establish spring, membrane, keycap,
      plate, or enclosure material composition for exact part 1391401 or the
      category population.
    notes:
      - Requires a qualified exact-part service record, bill of materials, or teardown.
    evidence_level: null
    source_ids: []
  - association_id: keyboard_standard_enclosure
    template_id: keyboard_standard
    component_id: enclosure
    position: 2
    status: commonly_associated
    applicability: >-
      Applies as the external housing concept across the reviewed physical keyboard
