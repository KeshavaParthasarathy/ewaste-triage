hazards:
  - hazard_id: mouse_damaged_lithium_ion_battery
    component_id: power_source
    scope:
      kind: subtype
      id: mouse_wireless_rechargeable
    applicability: >-
      Trigger only when item-specific manufacturer evidence or a legible battery
      marking independently establishes lithium-ion chemistry and the user reports
      swelling, damage, or overheating. Rechargeability alone is insufficient.
    trigger_observation_keys:
      - observations.issue_flags.overheating
      - observations.issue_flags.swelling_or_battery_damage
    severity: urgent
    immediate_actions:
      - Stop using and charging the mouse.
      - Keep the damaged battery or device away from flammable materials without crushing or puncturing it.
    follow_up_actions:
      - Contact the manufacturer or a qualified specialist for handling instructions.
      - Arrange prompt transfer to an appropriate battery or household-hazardous-waste collection point.
    handling_guidance:
      - Do not place a damaged lithium-ion battery in household trash or a municipal recycling bin.
      - Prevent terminal contact when the battery can be safely removed and handled without forcing the enclosure.
    disposal_guidance:
      - Use a certified electronics recycler, battery recycler, or household-hazardous-waste program that accepts damaged lithium-ion batteries.
      - Follow the receiving program's instructions for damaged batteries before transport.
    evidence_level: B
    source_ids:
      - epa_used_li_ion_2026
  - hazard_id: mouse_leaking_primary_cell
    component_id: power_source
    scope:
      kind: subtype
      id: mouse_wireless_replaceable_battery
    applicability: >-
      Trigger only when the user reports a leaking installed primary cell in a
      replaceable-battery mouse. Subtype architecture alone does not prove the
      chemistry or condition of the cell currently installed.
    trigger_observation_keys:
      - observations.issue_flags.swelling_or_battery_damage
    severity: caution
    immediate_actions:
      - Stop using the mouse and avoid direct contact with leaking battery contents.
      - Keep the cell and device away from children and heat sources.
    follow_up_actions:
      - Follow local public-health guidance if battery contents contact skin or eyes.
      - Check local hazardous-waste instructions before transporting the leaking cell.
    handling_guidance:
      - Do not attempt to recharge a non-rechargeable primary cell.
      - Do not mix the leaking cell with new cells or with a different battery type.
    disposal_guidance:
      - Take the leaking cell to a municipal household-hazardous-waste or other locally approved battery collection program.
      - Protect exposed terminals as directed by the receiving program.
    evidence_level: B
    source_ids:
      - health_canada_battery_safety_2024
