hazards:
  - hazard_id: mouse_damaged_lithium_ion_battery
    component_id: power_source
    scope:
      kind: subtype
      id: mouse_wireless_rechargeable
    applicability: >-
      For a rechargeable mouse, a user report of overheating, swelling, or battery
      damage activates precautionary guidance. Lithium-ion-specific guidance applies
      if the installed battery is lithium-ion; rechargeability and the reported issue
      do not establish chemistry. Item-specific manufacturer information or battery
      markings may help identify chemistry.
    trigger_observation_keys:
      - observations.issue_flags.overheating
      - observations.issue_flags.swelling_or_battery_damage
    severity: urgent
    immediate_actions:
      - If the installed battery is lithium-ion and signs of battery damage are present, remove the mouse or battery from service.
      - If the installed battery is lithium-ion and signs of battery damage are present, place the mouse or battery away from flammable materials and avoid further physical damage.
    follow_up_actions:
      - If the installed battery is lithium-ion and damaged, contact the manufacturer for damaged-battery handling instructions before taking further action.
      - If the installed battery is lithium-ion and damaged, contact a local battery recycling center or receiving program for damaged-battery handling instructions and confirm it accepts that damaged battery before any transfer.
    handling_guidance:
      - If the installed battery is lithium-ion and damaged, follow manufacturer-specific handling instructions and do not remove it unless the mouse is designed to be user-serviceable and the battery can be safely removed.
      - If the installed battery is lithium-ion, damaged, and safely removed from a user-serviceable mouse, prevent terminal contact as directed by the manufacturer.
    disposal_guidance:
      - If the installed battery is lithium-ion and damaged, before any transfer or disposal obtain manufacturer or receiving-destination damaged-battery handling instructions and confirm the chosen destination accepts that damaged battery.
    evidence_level: B
    source_ids:
      - epa_used_li_ion_2026
      - mouse_osha_small_lithium_devices_2019
  - hazard_id: mouse_leaking_primary_cell
    component_id: power_source
    scope:
      kind: subtype
      id: mouse_wireless_replaceable_battery
    applicability: >-
      For a replaceable-battery mouse, a user report of swelling or battery damage
      activates precautionary guidance. Leakage-specific guidance applies if the
      installed cell is leaking; primary-cell guidance applies if it is
      non-rechargeable. The reported issue and subtype do not establish leakage,
      installed-cell type, or chemistry.
    trigger_observation_keys:
      - observations.issue_flags.swelling_or_battery_damage
    severity: caution
    immediate_actions:
      - Stop using the mouse; if leakage is present, avoid direct contact with battery contents.
      - Keep the cell and device away from children and heat sources.
    follow_up_actions:
      - Follow local public-health guidance if battery contents contact skin or eyes.
      - If leakage is present, check local hazardous-waste instructions before transporting the cell.
    handling_guidance:
      - If the installed cell is non-rechargeable, do not attempt to recharge it.
      - If leakage is present, do not mix that cell with new cells or with a different battery type.
    disposal_guidance:
      - Follow local municipal hazardous-waste requirements for the battery; if leakage is present, confirm that the chosen collection program accepts leaking cells.
      - Protect exposed terminals as directed by the receiving program.
    evidence_level: B
    source_ids:
      - health_canada_battery_safety_2024
