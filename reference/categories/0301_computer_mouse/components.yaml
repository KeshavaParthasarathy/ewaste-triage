templates:
  - template_id: mouse_modern_wireless
    template_kind: modern_overlay
    scope:
      kind: subtype
      id: mouse_wireless_rechargeable
    application_order: 0
  - template_id: mouse_standard
    template_kind: standard
    scope:
      kind: category
      id: 0301_computer_mouse
    application_order: 0

associations:
  - association_id: mouse_modern_wireless_power_source
    template_id: mouse_modern_wireless
    component_id: power_source
    position: 0
    status: commonly_associated
    applicability: >-
      Applies to the reviewed rechargeable wireless subtype examples that expose
      a USB-C charging path; this does not establish hidden cell chemistry.
    notes:
      - Apple and Logitech establish charging architecture for their reviewed products.
    evidence_level: B
    source_ids:
      - apple_magic_mouse_usb_c_2024
      - logitech_mx_master_3s_setup_2024
  - association_id: mouse_modern_wireless_wireless_module
    template_id: mouse_modern_wireless
    component_id: wireless_module
    position: 1
    status: commonly_associated
    applicability: >-
      Applies to reviewed rechargeable wireless mice; radio implementation remains
      model-specific.
    notes:
      - The reviewed sources name Bluetooth and, for MX Master 3S, Logi Bolt connectivity.
    evidence_level: B
    source_ids:
      - apple_magic_mouse_usb_c_2024
      - logitech_mx_master_3s_launch_2022
  - association_id: mouse_modern_wireless_battery_chemistry_unknown
    template_id: mouse_modern_wireless
    component_id: battery_chemistry
    position: 2
    status: unknown
    applicability: >-
      Rechargeability and USB-C charging do not establish lithium-ion chemistry
      for every mouse in this subtype.
    notes:
      - Requires an exact-model manufacturer specification or compliant battery marking.
    evidence_level: null
    source_ids: []
  - association_id: mouse_standard_connectivity
    template_id: mouse_standard
    component_id: connectivity
    position: 0
    status: commonly_associated
    applicability: >-
      A mouse requires an input connection, but whether it is wired, receiver-based,
      or Bluetooth depends on the resolved subtype and identity.
    notes:
      - Reviewed roster examples establish both wired and wireless connection architectures.
    evidence_level: C
    source_ids:
      - apple_magic_mouse_usb_c_2024
      - dell_ms116_technical_specifications_2025
      - logitech_g502_hero_launch_2018
      - razer_deathadder_v3_launch_2023
  - association_id: mouse_standard_controller_pcb_unknown
    template_id: mouse_standard
    component_id: controller_pcb
    position: 1
    status: unknown
    applicability: >-
      The reviewed public product sources do not expose a category-wide controller
      board assembly claim.
    notes:
      - Requires qualified teardown or service documentation across the category population.
    evidence_level: null
    source_ids: []
  - association_id: mouse_standard_controller_pcb_material_unknown
    template_id: mouse_standard
    component_id: controller_pcb_material
    position: 2
    status: unknown
    applicability: >-
      Controller-board material composition is not established for the category by
      the reviewed product sources.
    notes:
      - Requires exact bill-of-materials, environmental, or teardown evidence.
    evidence_level: null
    source_ids: []
  - association_id: mouse_standard_enclosure
    template_id: mouse_standard
    component_id: enclosure
    position: 3
    status: commonly_associated
    applicability: >-
      Applies as the external housing concept across the reviewed physical mouse
      products; shape and construction remain identity-specific.
    notes:
      - No category-wide material composition is inferred.
    evidence_level: C
    source_ids:
      - apple_magic_mouse_usb_c_2024
      - dell_ms116_technical_specifications_2025
      - logitech_g502_hero_launch_2018
  - association_id: mouse_standard_enclosure_material_unknown
    template_id: mouse_standard
    component_id: enclosure_material
    position: 4
    status: unknown
    applicability: >-
      The reviewed product specifications do not establish category-wide mouse
      enclosure material composition.
    notes:
      - Requires representative, scope-qualified material declarations rather than projection from a product image or form factor.
    evidence_level: null
    source_ids: []
  - association_id: mouse_standard_power_source
    template_id: mouse_standard
    component_id: power_source
    position: 5
    status: conditional
    applicability: >-
      Present for battery-bearing subtypes and not asserted for battery-free wired
      subtypes; exact installed cell or charging implementation remains model-specific.
    notes:
      - Subtype architecture determines whether this association applies.
    evidence_level: C
    source_ids:
      - apple_magic_mouse_usb_c_2024
      - logitech_m185_specs_2026
  - association_id: mouse_standard_scroll_wheel
    template_id: mouse_standard
    component_id: scroll_wheel
    position: 6
    status: conditional
    applicability: >-
      Present only where the resolved model documentation identifies a physical
      wheel or wheel mechanism; touch-scrolling designs are not collapsed into it.
    notes:
      - The G502 HERO launch source specifically discusses its scroll wheel mechanism.
    evidence_level: C
    source_ids:
      - logitech_g502_hero_launch_2018
      - logitech_mx_master_3s_launch_2022
  - association_id: mouse_standard_switches
    template_id: mouse_standard
    component_id: switches
    position: 7
    status: conditional
    applicability: >-
      Physical switch technology and rated controls require identity-specific
      support; no switch type is projected across every mouse.
    notes:
      - G502 HERO documents mechanical switches; DeathAdder V3 documents Gen-3 optical switches.
    evidence_level: C
    source_ids:
      - logitech_g502_hero_launch_2018
      - razer_deathadder_v3_launch_2023
  - association_id: mouse_standard_tracking_mechanism
    template_id: mouse_standard
    component_id: tracking_mechanism
    position: 8
    status: conditional
    applicability: >-
      Applies only when resolved subtype or identity evidence establishes a
      position-tracking implementation; ball and optical mechanisms remain scoped.
    notes:
      - The general Microsoft history distinguishes ball and optical tracking but does not resolve the intended legacy subtype or its power architecture.
    evidence_level: C
    source_ids:
      - logitech_g502_hero_launch_2018
      - microsoft_ball_to_optical_1999
      - razer_deathadder_v3_launch_2023
  - association_id: mouse_standard_wired_cable
    template_id: mouse_standard
    component_id: wired_cable
    position: 9
    status: conditional
    applicability: >-
      Applies to resolved wired mouse identities and is not projected onto wireless
      subtypes.
    notes:
      - Dell MS116, G502 HERO, and the wired DeathAdder V3 provide reviewed wired examples.
    evidence_level: C
    source_ids:
      - dell_ms116_technical_specifications_2025
      - logitech_g502_hero_launch_2018
      - razer_deathadder_v3_launch_2023
  - association_id: mouse_standard_wireless_module
    template_id: mouse_standard
    component_id: wireless_module
    position: 10
    status: conditional
    applicability: >-
      Applies only to a resolved wireless subtype; radio protocol and receiver form
      remain identity-specific.
    notes:
      - Reviewed roster sources establish Bluetooth and 2.4 GHz wireless examples.
    evidence_level: C
    source_ids:
      - apple_magic_mouse_usb_c_2024
      - logitech_mx_master_3s_launch_2022
  - association_id: mouse_legacy_ball_roller_details_unknown
    template_id: mouse_standard
    component_id: roller_mechanism
    position: 11
    status: unknown
    applicability: >-
      This Unknown does not assert that a roller is present in the current item.
      It preserves the missing roller-detail request for a future independently
      supported legacy mechanical-ball subtype and overlay.
    notes:
      - Requires a dated primary teardown, service manual, or manufacturer mechanical specification after the legacy subtype is reviewed.
    evidence_level: null
    source_ids: []
